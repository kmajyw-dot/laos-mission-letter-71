<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>LAOS 71호 - 2026년 7~8월 편지</title>
  <meta name="description" content="YO-JO Center LAOS 71호, 2026년 7~8월 선교편지">
  <style>
    :root { --ink:#24372f; --green:#257b5b; --cream:#f3efe5; --paper:#fff; --line:#d9d5ca; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:#e9e8e3; color:var(--ink); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
    button,select { font:inherit; }
    .toolbar { position:sticky; top:0; z-index:20; height:68px; padding:0 max(20px,calc((100vw - 1020px)/2)); display:flex; align-items:center; justify-content:space-between; gap:18px; color:white; background:rgba(31,53,44,.96); box-shadow:0 4px 22px #17261f22; backdrop-filter:blur(12px); }
    .brand { display:flex; align-items:center; gap:11px; min-width:0; }
    .brand-mark { width:34px; height:34px; display:grid; place-items:center; border:1px solid #a9c3b5; border-radius:50%; font-size:17px; }
    .brand span { display:flex; flex-direction:column; min-width:0; }
    .brand strong { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand small { color:#b9c9c0; font-size:10px; }
    .toolbar-actions { display:flex; align-items:center; gap:9px; }
    .toolbar label { display:flex; align-items:center; gap:7px; font-size:11px; color:#cbd8d1; }
    .toolbar select,.toolbar button { height:36px; border:1px solid #ffffff32; background:#ffffff0d; color:white; padding:0 12px; border-radius:4px; }
    .toolbar select option { color:#222; }
    .toolbar button { display:flex; align-items:center; gap:7px; cursor:pointer; font-weight:700; }
    .toolbar button:hover { background:#ffffff1c; }
    .intro { max-width:930px; margin:35px auto 24px; padding:0 15px; display:flex; justify-content:space-between; align-items:end; gap:25px; }
    .intro p { margin:0 0 7px; color:var(--green); font-size:11px; font-weight:800; letter-spacing:.16em; }
    .intro h1 { margin:0; font:500 clamp(27px,4vw,42px)/1.25 Georgia,"Noto Serif KR",serif; letter-spacing:-.04em; }
    .intro span { color:#69766f; font-size:12px; line-height:1.6; text-align:right; }
    .pages { width:min(930px,calc(100% - 30px)); margin:0 auto 70px; display:grid; gap:28px; }
    .page { position:relative; background:var(--paper); box-shadow:0 14px 40px #26372d1f; }
    .page img { display:block; width:100%; height:auto; }
    .page-tag { position:absolute; top:14px; right:14px; padding:6px 9px; border-radius:20px; background:#1d3329c9; color:white; font-size:10px; opacity:0; transition:.2s; }
    .page:hover .page-tag { opacity:1; }
    .jump { position:fixed; right:20px; bottom:20px; z-index:10; width:42px; height:42px; border:0; border-radius:50%; background:var(--green); color:white; box-shadow:0 8px 25px #16362a3d; cursor:pointer; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media (max-width:680px) {
      .toolbar { padding:0 12px; }
      .brand small,.toolbar label { display:none; }
      .toolbar button { font-size:0; width:38px; padding:0; justify-content:center; }
      .toolbar button span { font-size:19px; }
      .intro { align-items:flex-start; flex-direction:column; margin-top:25px; }
      .intro span { text-align:left; }
      .pages { width:100%; gap:12px; }
      .page { box-shadow:none; }
      .page-tag { display:none; }
    }
    @page { size:A4 portrait; margin:0; }
    @media print {
      body { background:white; }
      .toolbar,.intro,.jump { display:none!important; }
      .pages { width:auto; margin:0; display:block; }
      .page { width:210mm; height:297mm; margin:0; box-shadow:none; break-after:page; page-break-after:always; overflow:hidden; }
      .page:last-child { break-after:auto; page-break-after:auto; }
      .page img { width:210mm; height:297mm; object-fit:fill; }
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">🌿</div><span><strong>YO-JO CENTER 선교편지</strong><small>LAOS 71호 · 2026년 7~8월</small></span></div>
    <div class="toolbar-actions">
      <label for="page-select">페이지 이동
        <select id="page-select" aria-label="페이지 이동">
          <option value="1">1 / 8</option><option value="2">2 / 8</option><option value="3">3 / 8</option><option value="4">4 / 8</option><option value="5">5 / 8</option><option value="6">6 / 8</option><option value="7">7 / 8</option><option value="8">8 / 8</option>
        </select>
      </label>
      <button type="button" onclick="window.print()" aria-label="A4로 인쇄하거나 PDF로 저장"><span aria-hidden="true">⎙</span> A4 인쇄</button>
    </div>
  </header>

  <section class="intro">
    <div><p>MISSION LETTER ARCHIVE</p><h1>울창한 숲도 한 알의 작은 밀알에서 시작됩니다</h1></div>
    <span>원본의 사진과 지면 구성을 보존한 HTML 버전입니다.<br>상단의 인쇄 버튼으로 A4 출력 또는 PDF 저장이 가능합니다.</span>
  </section>

  <main class="pages" aria-label="LAOS 71호 선교편지 8쪽">
    <section class="page" id="page-1" aria-label="1쪽 - 인사말과 차량 헌금 보고"><img src="assets/page-1.jpg" alt="LAOS 71호 1쪽. 인사말, 차량 마련 소식과 후원 내역 표"><span class="page-tag">1 / 8</span></section>
    <section class="page" id="page-2" aria-label="2쪽 - 우박 피해 지원과 인제대학교 MOU"><img loading="lazy" src="assets/page-2.jpg" alt="우박 피해 장애인 가정 지원과 인제대학교 MOU 체결 소식"><span class="page-tag">2 / 8</span></section>
    <section class="page" id="page-3" aria-label="3쪽 - 신촌교회 미라클팀과 윤샛별 선생님"><img loading="lazy" src="assets/page-3.jpg" alt="신촌교회 미라클 5팀과 윤샛별 선생님의 방문 소식"><span class="page-tag">3 / 8</span></section>
    <section class="page" id="page-4" aria-label="4쪽 - 높은뜻광성교회와 완도성광교회"><img loading="lazy" src="assets/page-4.jpg" alt="높은뜻광성교회 청년팀과 완도성광교회 단기 선교팀 소식"><span class="page-tag">4 / 8</span></section>
    <section class="page" id="page-5" aria-label="5쪽 - 구호센터 식사 봉사와 장애 인식 사역"><img loading="lazy" src="assets/page-5.jpg" alt="비엔티안 구호센터 식사 봉사 및 장애 인식 개선 사역 계획"><span class="page-tag">5 / 8</span></section>
    <section class="page" id="page-6" aria-label="6쪽 - 동화책과 장애 가정 나들이"><img loading="lazy" src="assets/page-6.jpg" alt="장애 포용 동화책 사업과 장애 가정 나들이 소식"><span class="page-tag">6 / 8</span></section>
    <section class="page" id="page-7" aria-label="7쪽 - 건축 보고, 차량 구입과 연락처"><img loading="lazy" src="assets/page-7.jpg" alt="건축 최종 보고, 2호차 구입 계획, 수입 지출 및 후원 계좌"><span class="page-tag">7 / 8</span></section>
    <section class="page" id="page-8" aria-label="8쪽 - YO-JO 센터 안내"><img loading="lazy" src="assets/page-8.jpg" alt="장애 자녀와 함께 누리는 라오스 쉼과 힐링 여행 및 YO-JO 센터 안내"><span class="page-tag">8 / 8</span></section>
  </main>

  <button class="jump" type="button" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="맨 위로">↑</button>
  <script>
    document.getElementById('page-select').addEventListener('change', function () {
      document.getElementById('page-' + this.value).scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  </script>
</body>
</html>
